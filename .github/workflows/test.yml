name: test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck prove.sh seal.sh comment.sh

  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start the test app
        run: |
          node test/app/server.mjs &
          npx -y wait-on@8 http://127.0.0.1:4330/api/health
      - name: Prove the test contract with this action
        id: prove
        uses: ./
        with:
          contracts: test/contracts/*.json
          comment: false
      - name: The verdict is proven, with UAT left for a person
        env:
          VERDICT: ${{ steps.prove.outputs.verdict }}
          AUTO_MERGE: ${{ steps.prove.outputs.auto-merge }}
          PROOF_DIR: ${{ steps.prove.outputs.proof-dir }}
        run: |
          test "$VERDICT" = proven
          test "$AUTO_MERGE" = false
          test -f "$PROOF_DIR/CR-1/proof.json"
          test -f "$PROOF_DIR/CR-1/AC-2.png"

  # The second job: runs none of the change's code, checks and signs the proofs.
  seal:
    needs: prove
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: A key for this run only
        run: |
          MLOLA_HOME="$RUNNER_TEMP/signer" npx -y -p @mlola/browser-cli@0.19.0 mlola receipt keygen
          echo "MLOLA_RECEIPT_KEY=$RUNNER_TEMP/signer/keys/receipt-ed25519.pem" >> "$GITHUB_ENV"
      - name: Seal with this action
        id: seal
        uses: ./seal
        with:
          contracts: test/contracts/*.json
          checkout: false
      - name: Every proof is sound, signed here, and proven with UAT left for a person
        env:
          VERDICT: ${{ steps.seal.outputs.verdict }}
          AUTO_MERGE: ${{ steps.seal.outputs.auto-merge }}
          SIGNED: ${{ steps.seal.outputs.signed }}
          PROOF_DIR: ${{ steps.seal.outputs.proof-dir }}
        run: |
          test "$VERDICT" = proven
          test "$AUTO_MERGE" = false
          test "$SIGNED" = true
          grep -q '"signature"' "$PROOF_DIR/CR-1/proof.json"
      - name: A proof edited after it was made does not pass
        env: { PROOF_DIR: "${{ steps.seal.outputs.proof-dir }}" }
        run: |
          sed -i 's/"verdict": "failed"/"verdict": "verified"/; s/"reason": "/"reason": "edited /' "$PROOF_DIR/CR-1/proof.json"
          if npx -y -p @mlola/browser-cli@0.19.0 mlola receipt check "$PROOF_DIR/CR-1/proof.json"; then exit 1; fi
